<mat-card>
  <mat-card-title>
    <h1>{{ blockDef.title }}</h1>
  </mat-card-title>
  <mat-card-content>
    <div class="graphics-row">
      <ng-container [ngSwitch]="blockDef.type">
        <pnx-calc-visualization-scalar
          *ngSwitchCase="'scalaire'"
          [data]="blockDef.data"
        ></pnx-calc-visualization-scalar>
        <pnx-calc-visualization-chart
          *ngSwitchCase="'barChart'"
          [data]="blockDef.data"
          [type]="'bar'"
        ></pnx-calc-visualization-chart>
        <pnx-calc-visualization-chart
          *ngSwitchCase="'lineChart'"
          [data]="blockDef.data"
          [type]="'line'"
        ></pnx-calc-visualization-chart>
        <pnx-calc-visualization-table
          *ngSwitchCase="'table'"
          [data]="blockDef.data"
        ></pnx-calc-visualization-table>
      </ng-container>
      <button
        mat-icon-button
        (click)="onInformationClick()"
      >
        <mat-icon>info</mat-icon>
      </button>
    </div>
    <div
      class="description"
      [innerHTML]="blockDef.description"
    ></div>
  </mat-card-content>
</mat-card>
<ng-template
  #infoModal
  let-modal
>
  <div class="modal-header">
    <h4
      class="modal-title"
      id="modal-basic-title"
    >
      {{ blockDef.title }}
    </h4>
    <button
      type="button"
      class="close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div
    class="modal-body"
    [innerHTML]="blockDef.info"
  ></div>
</ng-template>

<div class="container">
  <div class="actions-header">
    <a
      mat-raised-button
      routerLink="/calculatrice"
      [queryParams]="protocolId ? { protocol: protocolId } : null"
    >
      <mat-icon>chevron_left</mat-icon>
      Retour
    </a>
    <button
      type="button"
      mat-raised-button
      color="primary"
      [disabled]="!campaignForm.valid"
      (click)="onSubmit()"
    >
      <mat-icon>visibility</mat-icon>
      Visualiser
    </button>
  </div>
  <div class="card">
    <div class="card-body">
      <form
        [formGroup]="campaignForm"
        (ngSubmit)="onSubmit()"
      >
        <div class="form-container">
          <div class="sites-group-form-container">
            <h5>Groupe de sites</h5>
            <ng-select
              #sitesGroupSelect
              id="sitesGroupSelect"
              [items]="sitesGroupChoices"
              bindLabel="name"
              bindValue="id"
              placeholder="Sélectionner un groupe de sites"
              formControlName="sitesGroup"
            ></ng-select>
          </div>
          <div formArrayName="campaigns">
            <div class="campaigns-form-container">
              <h4>Campagnes</h4>
              <button
                type="button"
                class="btn btn-primary"
                (click)="addCampaign()"
              >
                + Ajouter une campagne
              </button>
            </div>
            <div
              *ngFor="let campaign of campaigns.controls; let campaignIndex = index"
              [formGroupName]="campaignIndex"
              class="campaign-item mb-3 p-3 border rounded"
            >
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Campagne #{{ campaignIndex + 1 }}</h5>
                <button
                  *ngIf="campaigns.controls.length > 1"
                  type="button"
                  class="btn btn-danger btn-sm"
                  (click)="removeCampaign(campaignIndex)"
                >
                  Supprimer
                </button>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label [for]="'startDate-' + campaignIndex">Date de début</label>
                    <input
                      [id]="'startDate-' + campaignIndex"
                      type="date"
                      class="form-control"
                      formControlName="startDate"
                      (change)="onStartDateChange(campaign)"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label [for]="'endDate-' + campaignIndex">Date de fin</label>
                    <input
                      [id]="'endDate-' + campaignIndex"
                      type="date"
                      class="form-control"
                      formControlName="endDate"
                    />
                  </div>
                </div>
              </div>
              <div
                *ngIf="campaign.errors?.['endIsBeforeStart']"
                class="alert alert-danger"
              >
                La fin de la campagne doit être après son début.
              </div>
            </div>
          </div>
        </div>

        <div
          *ngIf="campaigns.errors?.['campaignsOverlap']"
          class="alert alert-danger"
        >
          Les campagnes ne doivent pas se chevaucher.
        </div>
      </form>
    </div>
  </div>
</div>

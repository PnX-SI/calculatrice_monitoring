<div class="visualization-container">
  <div class="visualization-page">
    <div class="visualization-nav">
      <a
        mat-raised-button
        [routerLink]="['/calculatrice/visualization', indicatorId, 'params']"
        [queryParams]="queryParams"
        class="return-button"
      >
        <mat-icon>chevron_left</mat-icon>
        Retour
      </a>
      <mat-selection-list
        role="list"
        hideSingleSelectionIndicator
        #selectionsList
        [multiple]="false"
        (selectionChange)="onSelectionsChange(selectionsList.selectedOptions.selected)"
      >
        <mat-list-option
          *ngFor="let selection of selections"
          [value]="selection"
          [disabled]="selection.disabled"
          [selected]="selection === currentSelection"
          [matTooltip]="selection.disabled ? selection.tooltip || '' : ''"
          class="mat-elevation-z2"
        >
          {{ selection.label }}
        </mat-list-option>
      </mat-selection-list>
    </div>
    <div class="blocks-container">
      <mat-card
        *ngIf="currentSelection?.type === 'statisticalTests'"
        class="statistical-tests-campaign-selector"
      >
        <mat-card-title>
          <h2>Sélection des campagnes à comparer</h2>
        </mat-card-title>
        <mat-card-content>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-0">
                <label for="firstCampaignSelect">Première campagne</label>
                <select
                  id="firstCampaignSelect"
                  class="custom-select"
                  [formControl]="firstCampaignControl"
                  (change)="onCampaignChange()"
                >
                  <option
                    *ngFor="let campaign of availableCampaigns"
                    [value]="getCampaignKey(campaign)"
                    [disabled]="getCampaignKey(campaign) === secondCampaignControl.value"
                  >
                    Campagne {{ campaign.startDate }} - {{ campaign.endDate }}
                  </option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-0">
                <label for="secondCampaignSelect">Deuxième campagne</label>
                <select
                  id="secondCampaignSelect"
                  class="custom-select"
                  [formControl]="secondCampaignControl"
                  (change)="onCampaignChange()"
                >
                  <option
                    *ngFor="let campaign of availableCampaigns"
                    [value]="getCampaignKey(campaign)"
                    [disabled]="getCampaignKey(campaign) === firstCampaignControl.value"
                  >
                    Campagne {{ campaign.startDate }} - {{ campaign.endDate }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>

      <div
        *ngIf="visualizationError"
        class="visualization-error alert alert-warning"
      >
        <div *ngIf="showGenericError(); else actualError">
          Une erreur inattendue s'est produite durant l'évaluation de l'indicateur. Veuillez
          contacter le responsable de l'indicateur.
        </div>
        <ng-template #actualError>
          <div>{{ visualizationError.message }}</div>
        </ng-template>
      </div>
      <pnx-calc-visualization-block
        *ngFor="let block of vizBlocks; let blockIndex = index"
        [id]="'viz-block-' + blockIndex"
        [blockDef]="block"
      ></pnx-calc-visualization-block>
    </div>
    <div
      *ngIf="vizBlocks?.length > 0"
      class="visualization-toc"
    >
      <ul>
        <li
          *ngFor="let block of vizBlocks; let blockIndex = index"
          [class.active]="blockIndex === activeBlockIndex"
        >
          <a
            role="button"
            (click)="scrollToBlock(blockIndex)"
          >
            {{ block.title }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
